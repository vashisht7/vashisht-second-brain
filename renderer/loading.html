<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Vashisht Devasani</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; color: #eef4f2; background: radial-gradient(circle at 50% 30%, #253a42 0, #11171d 48%, #0b0d10 100%); font: 14px -apple-system, BlinkMacSystemFont, sans-serif; -webkit-app-region: drag; }
    main { text-align: center; padding-top: 22px; }
    .mark { width: 88px; height: 88px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 27px; color: white; font-size: 30px; font-weight: 750; background: linear-gradient(145deg, #253348, #31998c); box-shadow: 0 18px 55px #0008, inset 0 0 0 1px #ffffff22; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.4px; }
    p { margin: 0; color: #9dafaa; }
    .dots { display: flex; justify-content: center; gap: 7px; margin-top: 24px; }
    .dots span { width: 6px; height: 6px; border-radius: 50%; background: #53c7b6; animation: pulse 1.2s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.15); } }
  </style>
</head>
<body><main><div class="mark">VD</div><h1>Vashisht Devasani</h1><p>Loading your private local second brain…</p><div class="dots"><span></span><span></span><span></span></div></main></body>
</html>
