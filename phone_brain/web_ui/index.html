<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rishi" />
  <meta name="description" content="Vashisht's Private Second Brain — accessible from anywhere" />
  <title>Rishi — Second Brain</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0a0a0f;
      --surface:    #12121a;
      --surface2:   #1a1a26;
      --border:     rgba(255,255,255,0.08);
      --accent:     #7c6eff;
      --accent2:    #c084fc;
      --text:       #e8e8f0;
      --muted:      #6b6b8a;
      --success:    #34d399;
      --error:      #f87171;
      --radius:     16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .orb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #7c6eff, #c084fc, #38bdf8, #7c6eff);
      animation: spin 6s linear infinite;
      filter: drop-shadow(0 0 8px rgba(124,110,255,0.6));
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #7c6eff, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .status-dot.online  { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.offline { background: var(--error); }

    /* ── Conversation area ── */
    .conversation {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state .big-orb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #7c6eff, #c084fc, #38bdf8, #7c6eff);
      animation: spin 8s linear infinite;
      filter: drop-shadow(0 0 24px rgba(124,110,255,0.5));
      margin-bottom: 8px;
    }

    .empty-state p { font-size: 15px; line-height: 1.6; max-width: 260px; }
    .empty-state h2 { font-size: 20px; font-weight: 600; color: var(--text); }

    /* ── Messages ── */
    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user  { align-items: flex-end; }
    .message.brain { align-items: flex-start; }

    .bubble {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.6;
    }

    .message.user  .bubble {
      background: linear-gradient(135deg, #7c6eff, #6055dd);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.brain .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .message.brain .bubble.loading {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 16px;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s ease infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .source-tag {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
    }

    .confidence {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Input area ── */
    .input-area {
      position: sticky;
      bottom: 0;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      padding: 12px 14px;
      resize: none;
      max-height: 120px;
      min-height: 46px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    button.send-btn {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #7c6eff, #6055dd);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }
    button.send-btn:active { transform: scale(0.93); }
    button.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Setup Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .modal h2 { font-size: 20px; font-weight: 600; }
    .modal p  { font-size: 14px; color: var(--muted); line-height: 1.6; }

    .modal input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      width: 100%;
      outline: none;
      font-family: monospace;
    }
    .modal input:focus { border-color: var(--accent); }

    .modal button {
      background: linear-gradient(135deg, #7c6eff, #6055dd);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .modal button:active { opacity: 0.85; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Setup Modal (shown on first launch) -->
<div class="modal-overlay" id="setupModal">
  <div class="modal">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="orb"></div>
      <span class="logo-text">Rishi Setup</span>
    </div>
    <h2>Connect to your Brain</h2>
    <p>Enter your Mac Mini URL and API key. These are saved locally on your phone.</p>
    <input type="url" id="serverUrl" placeholder="http://macmini.tail123.ts.net:8080" autocomplete="off" autocorrect="off" autocapitalize="none" />
    <input type="password" id="apiKey" placeholder="Your API key" autocomplete="off" />
    <button onclick="saveSetup()">Connect →</button>
  </div>
</div>

<!-- Header -->
<header>
  <div class="logo">
    <div class="orb"></div>
    <span class="logo-text">Rishi</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:12px;color:var(--muted)" id="statusText">Connecting...</span>
    <div class="status-dot" id="statusDot"></div>
    <span style="font-size:18px;cursor:pointer" onclick="showSetup()" title="Settings">⚙️</span>
  </div>
</header>

<!-- Conversation -->
<div class="conversation" id="conversation">
  <div class="empty-state" id="emptyState">
    <div class="big-orb"></div>
    <h2>Ask me anything</h2>
    <p>I have access to your personal notes, documents, and knowledge — ask naturally.</p>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-row">
    <textarea
      id="questionInput"
      placeholder="Ask your Second Brain..."
      rows="1"
      onkeydown="handleKeyDown(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendQuery()">↑</button>
  </div>
</div>

<script>
  const STORAGE_KEY_URL = 'brain_server_url';
  const STORAGE_KEY_KEY = 'brain_api_key';

  let serverUrl = localStorage.getItem(STORAGE_KEY_URL) || '';
  let apiKey    = localStorage.getItem(STORAGE_KEY_KEY) || '';

  // Show setup if not configured
  if (!serverUrl || !apiKey) {
    document.getElementById('setupModal').classList.remove('hidden');
  } else {
    document.getElementById('setupModal').classList.add('hidden');
    checkStatus();
  }

  function saveSetup() {
    const url = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
    const key = document.getElementById('apiKey').value.trim();
    if (!url || !key) { alert('Please enter both URL and API key.'); return; }
    serverUrl = url;
    apiKey    = key;
    localStorage.setItem(STORAGE_KEY_URL, url);
    localStorage.setItem(STORAGE_KEY_KEY, key);
    document.getElementById('setupModal').classList.add('hidden');
    checkStatus();
  }

  function showSetup() {
    document.getElementById('serverUrl').value = serverUrl;
    document.getElementById('apiKey').value    = apiKey;
    document.getElementById('setupModal').classList.remove('hidden');
  }

  async function checkStatus() {
    const dot  = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    try {
      const res = await fetch(`${serverUrl}/status`, {
        headers: { 'X-API-Key': apiKey }
      });
      if (res.ok) {
        const data = await res.json();
        dot.className  = 'status-dot online';
        text.textContent = `${data.chunks.toLocaleString()} chunks`;
      } else {
        dot.className  = 'status-dot offline';
        text.textContent = 'Auth error';
      }
    } catch {
      dot.className  = 'status-dot offline';
      text.textContent = 'Offline';
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuery();
    }
  }

  function addMessage(role, content, sources, confidence) {
    const conv = document.getElementById('conversation');
    document.getElementById('emptyState').classList.add('hidden');

    const msg = document.createElement('div');
    msg.className = `message ${role}`;
    msg.id = `msg-${Date.now()}`;

    if (content === 'LOADING') {
      msg.innerHTML = `<div class="bubble loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    } else {
      let inner = `<div class="bubble">${escapeHtml(content)}</div>`;
      if (sources && sources.length) {
        const tags = sources.map(s =>
          `<span class="source-tag">${s.type} · ${s.approx_date} · ${Math.round(s.relevance*100)}%</span>`
        ).join('');
        inner += `<div class="sources">${tags}</div>`;
      }
      if (confidence !== undefined) {
        inner += `<div class="confidence">Confidence: ${Math.round(confidence*100)}%</div>`;
      }
      msg.innerHTML = inner;
    }

    conv.appendChild(msg);
    conv.scrollTop = conv.scrollHeight;
    return msg.id;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  async function sendQuery() {
    const input = document.getElementById('questionInput');
    const question = input.value.trim();
    if (!question || !serverUrl) return;

    document.getElementById('sendBtn').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMessage('user', question);
    const loadingId = addMessage('brain', 'LOADING');

    try {
      const res = await fetch(`${serverUrl}/query`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-API-Key':    apiKey
        },
        body: JSON.stringify({ question })
      });

      // Remove loading bubble
      document.getElementById(loadingId)?.remove();

      if (!res.ok) {
        addMessage('brain', res.status === 401 ? 'Authentication failed — check your API key.' : `Error ${res.status}`);
        return;
      }

      const data = await res.json();
      addMessage('brain', data.answer, data.sources, data.confidence);

    } catch (err) {
      document.getElementById(loadingId)?.remove();
      addMessage('brain', 'Could not reach your Second Brain. Check that your Mac Mini is online and on Tailscale.');
    } finally {
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  }

  // Register service worker for PWA offline shell
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
